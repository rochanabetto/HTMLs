<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Protótipo – Comunicação (Fiscalização e Gestão de Contratos)</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff;--fg:#1b1b1b;--mut:#555;--bd:#c8c8c8;--card:#f3f3f3;--pri:#1351B4;--hd:#0c326f;--gb:#cfe9d6;--gf:#1a5c2e;--bb:#d4e0f5;--bf:#1b3a73;--ab:#fff1c9;--af:#6b4a00;--ac:#e0a800;--rb:#fde0e0;--rf:#8a1313;--nb:#ddd;--nf:#333}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121826;--fg:#eceff4;--mut:#aab2c0;--bd:#3a4458;--card:#1c2436;--pri:#7ea8f5;--hd:#9db9ee;--gb:#1d4a2c;--gf:#b9e8c8;--bb:#233a66;--bf:#c8d9fa;--ab:#4a3a0a;--af:#ffe08a;--rb:#5a1c1c;--rf:#ffc9c9;--nb:#333c50;--nf:#dde}}
:root[data-theme="dark"]{--bg:#121826;--fg:#eceff4;--mut:#aab2c0;--bd:#3a4458;--card:#1c2436;--pri:#7ea8f5;--hd:#9db9ee;--gb:#1d4a2c;--gf:#b9e8c8;--bb:#233a66;--bf:#c8d9fa;--ab:#4a3a0a;--af:#ffe08a;--rb:#5a1c1c;--rf:#ffc9c9;--nb:#333c50;--nf:#dde}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Segoe UI",Arial,sans-serif;font-size:14px}
header{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;padding:12px 24px;border-bottom:1px solid var(--bd)}
.logo{font-size:24px;font-weight:700;color:var(--hd)}main{padding:16px 24px;max-width:1280px;margin:0 auto}
h1{font-size:30px;font-weight:400;margin:4px 0}.mut{color:var(--mut);font-size:13px}
.pill{display:inline-block;padding:4px 10px;border-radius:4px;font-size:13px;white-space:nowrap;border:1px solid transparent}
.pf{display:flex;align-items:center;justify-content:center;width:200px;height:40px;box-sizing:border-box;text-align:center;white-space:normal;line-height:1.2;padding:0 8px}.gb{background:var(--gb);color:var(--gf)}.bb{background:var(--bb);color:var(--bf)}.nb{background:var(--nb);color:var(--nf)}.amb{background:var(--ab);color:var(--af);border-color:var(--ac)}.red{background:var(--rb);color:var(--rf);border-color:#c53030}
.tabs{display:flex;gap:0;max-width:760px;margin:12px auto}.tabs div{flex:1;text-align:center;padding:10px;border-bottom:4px solid var(--bd);color:var(--mut)}.tabs .on{border-color:var(--pri);color:var(--pri);font-weight:700}
.bp,.bs{border-radius:24px;padding:9px 22px;font-weight:600;font-size:14px;cursor:pointer}.bp{background:var(--pri);color:var(--bg);border:1px solid var(--pri)}.bs{background:none;color:var(--pri);border:1px solid var(--pri)}
.chip{border:1px solid var(--bd);background:none;color:var(--fg);border-radius:16px;padding:5px 12px;cursor:pointer;font-size:13px}.chip.on{background:var(--pri);color:var(--bg);border-color:var(--pri)}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:10px 8px;text-align:left;border-top:1px solid var(--bd);vertical-align:top}th{border-top:0;font-weight:600}
.ib{border:0;background:none;padding:5px;cursor:pointer;position:relative}.i{width:20px;height:20px;fill:none;stroke:var(--pri);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dot{position:absolute;top:1px;right:1px;width:9px;height:9px;border-radius:50%;background:#d32f2f}
.lk{background:none;border:0;color:var(--pri);text-decoration:underline;cursor:pointer;font-size:14px;padding:0}
.box{border:1px solid var(--bd);padding:16px;border-radius:4px}.ban{padding:12px 14px;border-radius:4px;margin:12px 0;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.tb{display:flex;gap:22px;border-bottom:2px solid var(--bd);margin-bottom:14px}.tb button{background:none;border:0;border-bottom:4px solid transparent;padding:8px 0;font-size:14px;color:var(--mut);cursor:pointer;margin-bottom:-2px}.tb .on{color:var(--pri);border-color:var(--pri);font-weight:700}
.orig{background:var(--card);border:1px solid var(--bd);border-radius:4px;padding:12px 14px;line-height:1.6}.msg{border:1px solid var(--bd);border-left:6px solid;border-radius:4px;padding:10px 14px;margin-bottom:10px}
.lbl{font-weight:600;margin:10px 0 4px}input[type=text],input[type=date],select,textarea{width:100%;box-sizing:border-box;padding:9px;border:1px solid var(--mut);border-radius:4px;background:var(--bg);color:var(--fg);font:inherit}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:60px 12px;overflow:auto;z-index:5}.md{background:var(--bg);border-radius:6px;width:min(620px,100%);padding:22px}
.hl{background:var(--card);border-radius:4px;padding:10px 14px;margin:10px 0}.tt{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0c326f;color:#fff;padding:10px 18px;border-radius:6px;z-index:9}
.paper{background:#fff;color:#111;max-width:794px;margin:16px auto;padding:36px 44px;box-shadow:0 2px 8px rgba(0,0,0,.35)}.paper th{background:#eee}.paper td,.paper th{border-color:#ddd}.paper .hh{font-weight:700;color:#0c326f;border-bottom:2px solid #0c326f;margin:18px 0 8px;padding-bottom:3px}
@media print{header,.np,.hint{display:none!important}body{background:#fff}.paper{box-shadow:none;margin:0}}
</style></head><body>
<header><div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><span class="logo">Contratos.gov.br</span><span id="who" class="mut" style="border-left:1px solid var(--bd);padding-left:14px"></span></div>
<label class="mut">Entrar como: <select id="per" onchange="S.who=this.value;S.view='list';S.m=null;R()" style="width:auto"><option value="gest">Maria Souza – Gestora</option><option value="fisc">Carlos Lima – Fiscal técnico</option><option value="forn">Fulano da Silva – Fornecedor</option></select></label></header>
<main id="app"></main>
<script>
const TODAY='2026-10-08',L={org:'Fiscalização',forn:'Fornecedor'};
const P={gest:{h:'MARIA SOUZA (GESTORA) · Unidade 000000',nome:'Maria Souza',papel:'Gestora',lado:'org'},fisc:{h:'CARLOS LIMA (FISCAL TÉCNICO) · Unidade 000000',nome:'Carlos Lima',papel:'Fiscal técnico',lado:'org'},forn:{h:'FULANO DA SILVA (FORNEC2) · Fornecedor Jurídico 1 – 08.696.925/0001-20',nome:'Fulano da Silva',papel:'Preposto',lado:'forn'}};
const RESP=[['Carlos Lima','Fiscal técnico'],['Joana Alves','Fiscal administrativo'],['Maria Souza','Gestora'],['Pedro Reis','Gestor substituto']];
const fd=d=>d.split('-').reverse().join('/'),fs=d=>fd(d).slice(0,5),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const au=l=>l==='forn'?'Fulano da Silva (Preposto)':'Carlos Lima (Fiscal técnico)';
const now=()=>'08/10/2026 '+new Date().toTimeString().slice(0,5);
const H=(dt,ev,user,det)=>({dt,ev,user,det});
const mk=(id,num,tipo,ass,lado,data,desc,sit,pend,rs,ok,msgs,un)=>({id,num,tipo,ass,lado,data,desc,sit,pend,rs,ok,msgs,un,hist:[H(fd(data)+' 10:00',sit==='Em elaboração'?'Rascunho criado':'Enviado',au(lado),pend?'Exige resposta até '+fd(pend.prazo):'')]});
const seed=()=>[
mk(5,'00005/2026','Ofício','Substituição de encarregado','forn','2026-09-02','Informamos a substituição do encarregado da contratada a partir de 10/09/2026, conforme ofício anexo.','Enviado',{de:'org',prazo:'2026-10-16'},null,null,[],{org:true,forn:false}),
mk(3,'00003/2026','Aviso','Interdição da Esplanada','forn','2026-09-01','Comunicamos a interdição parcial do acesso à Esplanada para entrega dos materiais.','Visualizado',{de:'org',prazo:'2026-10-12'},'Carlos Lima',null,[],{org:false,forn:false}),
mk(2,'00002/2026','Nota Técnica','Atualização de planilha de custos','org','2026-08-31','Solicitamos a atualização da planilha de custos conforme a repactuação.','Enviado',{de:'forn',prazo:'2026-10-02'},'Maria Souza',null,[],{org:false,forn:true}),
mk(4,'00004/2026','Ofício','Solicitação de documentos','org','2026-08-28','Solicitamos o envio das certidões e da relação atualizada de empregados.','Visualizado',null,'Carlos Lima',{por:'forn',em:'04/09'},[{lado:'forn',autor:'Fulano da Silva (Preposto)',dt:'04/09/2026 15:42',txt:'Seguem as certidões em anexo. A relação de empregados será enviada até 10/09.',ex:null}],{org:true,forn:false}),
mk(1,'00001/2026','Aviso','Programação de férias coletivas','org','2026-08-25','Aviso sobre a programação de férias coletivas da equipe.','Visualizado',null,null,null,[],{org:false,forn:false}),
mk(7,'00000/2026','Ofício','Substituição de uniformes','forn','2026-08-20','Solicitação de substituição dos uniformes.','Encerrado',null,'Carlos Lima',{por:'org',em:'22/08'},[],{org:false,forn:false}),
mk(6,'00006/2026','Aviso','Reajuste anual – minuta','org','2026-10-06','Minuta do aviso de reajuste anual.','Em elaboração',null,null,null,[],{org:false,forn:false})];
let D=seed(),S={who:'gest',view:'list',id:null,tab:'d',f:'all',m:null};
const me=()=>P[S.who],cur=()=>D.find(c=>c.id===S.id),oth=l=>l==='org'?'forn':'org';
const ico={eye:'<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>',chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.4A8 8 0 1 1 21 12z"/>',pen:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',redo:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/>'};
const ib=(n,l,a,dot)=>`<button class="ib" aria-label="${l}" title="${l}" onclick="${a}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ico[n]}</svg>${dot?'<span class="dot"></span>':''}</button>`;
const SP={'Em elaboração':'nb','Enviado':'gb','Visualizado':'gb','Encerrado':'bb'};
const sp=(s,f)=>`<span class="pill ${SP[s]}${f?' pf':''}">${s}</span>`;
function pend(c,f){const m=me(),pf=f?' pf':'';if(c.sit==='Em elaboração'||c.sit==='Encerrado')return '<span class="mut">-</span>';
if(c.pend){const v=c.pend.prazo<TODAY,mine=c.pend.de===m.lado;return `<span class="pill ${v?'red':'amb'}${pf}">${mine&&m.lado==='forn'?'Sua resposta':L[c.pend.de]} · ${v?'prazo vencido':'até '+fs(c.pend.prazo)}</span>`}
if(c.ok)return `<span class="mut">Respondido pel${c.ok.por==='forn'?'o fornecedor':'a fiscalização'} em ${c.ok.em}</span>`;return '<span class="mut">Sem pendência</span>'}
function add(c,ev,det){c.hist.push(H(now(),ev,me().nome+' ('+me().papel+')',det||''))}
function toast(t){const e=document.createElement('div');e.className='tt';e.textContent=t;e.setAttribute('role','status');document.body.appendChild(e);setTimeout(()=>e.remove(),3200)}
function R(){document.getElementById('who').textContent=me().h;document.getElementById('per').value=S.who;
document.getElementById('app').innerHTML=({list:vList,det:vDet,form:vForm,rep:vRep})[S.view]()+(S.m?vMod():'');}
function vList(){const m=me(),o=m.lado==='org',a=D.filter(c=>c.sit!=='Em elaboração'||c.lado===m.lado);
const F={all:()=>1,mine:c=>c.pend&&c.pend.de===m.lado&&c.sit!=='Encerrado',oth:c=>c.pend&&c.pend.de!==m.lado&&c.sit!=='Encerrado',ven:c=>c.pend&&c.pend.prazo<TODAY&&c.sit!=='Encerrado',atr:c=>c.rs===m.nome&&c.sit!=='Encerrado'};
const ch=[['all','Todos'],['mine',o?'Aguardando a fiscalização':'Aguardando minha resposta'],['oth',o?'Aguardando o fornecedor':'Aguardando a fiscalização'],['ven','Prazo vencido']].concat(o?[['atr','Atribuídos a mim']]:[]);
const rows=a.filter(F[S.f]).sort((x,y)=>y.data.localeCompare(x.data)||y.id-x.id).map(c=>{
const bt=l=>`<button class="lk" onclick="act('atr',${c.id})">${l}</button>`;const rsp=!o?'':`<td>${c.sit==='Encerrado'?(c.rs?esc(c.rs):'-'):(c.rs?esc(c.rs)+' '+bt('Reatribuir'):bt('Atribuir'))}</td>`;
const ac=c.sit==='Em elaboração'?ib('eye','Visualizar',`act('open',${c.id},'d')`)+ib('pen','Editar rascunho',`act('edit',${c.id})`)+ib('trash','Excluir rascunho',`act('del',${c.id})`):ib('eye','Visualizar',`act('open',${c.id},'d')`)+ib('chat','Mensagens',`act('open',${c.id},'m')`,c.un[m.lado])+(o&&c.sit==='Encerrado'?ib('redo','Reabrir',`act('reab',${c.id})`):'');
return `<tr><td>${sp(c.sit,1)}</td><td>${c.num}</td><td>${fd(c.data)}</td><td>${L[c.lado]}</td><td>${c.tipo}</td><td>${esc(c.ass)}</td><td>${pend(c,1)}</td>${rsp}<td style="white-space:nowrap">${ac}</td></tr>`}).join('');
return `<h1>Comunicação</h1><div class="mut">Lista de comunicações · Fiscalização e Gestão de Contratos</div>
<div class="tabs"><div>Solicitações</div><div class="on">Comunicados</div><div>Ocorrências</div></div>
<div class="hint mut" style="background:var(--card);padding:10px 14px;border-radius:4px;margin-bottom:12px">Protótipo navegável. Use o seletor "Entrar como" para trocar de perfil (gestora, fiscal ou fornecedor). Experimente: abrir o balão de mensagens; atribuir/reatribuir (somente órgão); responder e pedir nova resposta; encerrar e reabrir; editar rascunhos (ícone de lápis); criar um comunicado já atribuindo a alguém (opcional) ou atribuir depois pelo botão Atribuir; gerar o relatório. Os dados são simulados e voltam ao início ao recarregar a página. <button class="lk" onclick="D=seed();S.view='list';S.f='all';R();toast('Demo reiniciada')">Reiniciar demo</button></div>
<button class="bp" onclick="S.ed=null;S.view='form';R()">+ Adicionar registro</button>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin:14px 0">${ch.map(x=>`<button class="chip ${S.f===x[0]?'on':''}" onclick="S.f='${x[0]}';R()">${x[1]} (${a.filter(F[x[0]]).length})</button>`).join('')}</div>
<div class="sc"><table><tr><th>Situação</th><th>Número</th><th>Data</th><th>Remetente</th><th>Tipo</th><th>Assunto</th><th>Pendência</th>${o?'<th>Atribuído a</th>':''}<th>Ações</th></tr>${rows||'<tr><td colspan="9">Nenhum registro.</td></tr>'}</table></div>
<p class="mut">Situações: Em elaboração · Enviado · Visualizado · Encerrado (somente manual; pode ser reaberto). A coluna "Pendência" é independente da situação; "-" indica que não há pendência aplicável (rascunho ou comunicado encerrado).</p>`}
function vDet(){const c=cur(),m=me(),o=m.lado==='org',enc=c.sit==='Encerrado';
let ban=enc?`<div class="ban bb"><span><b>Comunicado encerrado.</b> Novas mensagens estão bloqueadas.</span></div>`:c.pend?`<div class="ban ${c.pend.prazo<TODAY?'red':'amb'}"><span><b>Aguardando resposta ${c.pend.de==='forn'?(m.lado==='forn'?'de você':'do fornecedor'):'da fiscalização'}</b> · Prazo: ${fd(c.pend.prazo)}${o?' · Atribuído a: <b>'+(c.rs||'não atribuído')+'</b>':''}</span></div>`:`<div class="ban bb"><span>${c.ok?'<b>Respondido pel'+(c.ok.por==='forn'?'o fornecedor':'a fiscalização')+' em '+c.ok.em+'</b> · ':''}Sem pendência no momento.</span></div>`;
if(o&&!enc)ban=ban.replace('</div>',`<button class="bs" onclick="act('atr',${c.id})">${c.rs?'Reatribuir':'Atribuir'}</button></div>`);
const tabs=[['d','Dados da Comunicação'],['m','Mensagens ('+c.msgs.length+')'],['h','Histórico']].map(t=>`<button class="${S.tab===t[0]?'on':''}" onclick="S.tab='${t[0]}';R()">${t[1]}</button>`).join('');
let b='';
if(S.tab==='d')b=`<table><tr><td class="mut">Instrumento</td><td>Contrato 00001/2026 · Vigência 01/01/2026 a 31/12/2026</td></tr><tr><td class="mut">Categoria / Tipo</td><td>Comunicado · ${c.tipo}</td></tr><tr><td class="mut">Número / Data</td><td>${c.num} · ${fd(c.data)}</td></tr><tr><td class="mut">Assunto</td><td>${esc(c.ass)}</td></tr><tr><td class="mut">Remetente</td><td>${L[c.lado]} – ${au(c.lado)}</td></tr><tr><td class="mut">Situação</td><td>${sp(c.sit)}</td></tr><tr><td class="mut">Pendência</td><td>${pend(c)}</td></tr>${o?`<tr><td class="mut">Atribuído a</td><td>${c.rs||'não atribuído'}</td></tr>`:''}<tr><td class="mut">Descrição</td><td>${esc(c.desc)}</td></tr></table><p class="mut">Somente leitura. Respostas e novas mensagens ficam na aba Mensagens.</p>`;
if(S.tab==='m')b=`<div class="orig"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px"><b class="mut" style="font-size:12px">COMUNICADO ORIGINAL · ${c.tipo} ${c.num}</b>${(q=>q?'<span class="pill amb">'+q.det+'</span>':'')(c.hist.find(h=>h.det.startsWith('Exige')))}</div><b>Assunto:</b> ${esc(c.ass)}<br><span class="mut">Enviado por ${L[c.lado]} – ${au(c.lado)} em ${fd(c.data)}</span><div>${esc(c.desc)}</div><button class="lk" onclick="S.tab='d';R()">Ver dados completos</button></div>
<p class="mut" style="font-size:12px">O comunicado original não se repete como mensagem. Abaixo, só o que foi trocado depois do envio.</p><h3 style="margin:8px 0">Mensagens (${c.msgs.length})</h3>
${c.msgs.map(x=>`<div class="msg" style="border-left-color:${x.lado==='org'?'var(--pri)':'#2e7d32'}"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px"><span><b>${L[x.lado]} – ${esc(x.autor)}</b> <span class="mut">· ${x.dt}</span></span>${x.ex?'<span class="pill amb">Exige resposta · até '+fs(x.ex)+'</span>':''}</div><div>${esc(x.txt)}</div></div>`).join('')||'<div class="mut" style="border:1px dashed var(--bd);padding:12px;margin-bottom:10px">Nenhuma mensagem ainda.</div>'}
${enc?`<div class="hl">Envio de mensagens bloqueado enquanto o comunicado estiver encerrado.</div>`:c.sit==='Em elaboração'?'<div class="hl">Rascunho ainda não enviado. Use "Editar rascunho" para completar e enviar.</div>':`<div class="lbl">Nova mensagem *</div><textarea id="tx" rows="3" maxlength="2000" placeholder="Escreva aqui..."></textarea>
<div class="hl" style="border:2px solid var(--pri)"><label><input type="checkbox" id="ex" onchange="document.getElementById('pw').style.display=this.checked?'block':'none'"> <b>${o?'Exige nova resposta do fornecedor':'Esta mensagem exige resposta da fiscalização'}</b></label><div id="pw" style="display:none;max-width:220px"><div class="lbl">Prazo para resposta *</div><input type="date" id="pz" value="2026-10-15" min="${TODAY}"></div></div>`}
<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px">${o&&!enc&&c.sit!=='Em elaboração'?`<button class="bs" onclick="act('enc',${c.id})">Encerrar comunicado</button>`:o&&enc?`<button class="bp" onclick="act('reab',${c.id})">Reabrir comunicado</button>`:'<span></span>'}${enc||c.sit==='Em elaboração'?'':`<button class="bp" onclick="act('send')">Enviar mensagem</button>`}</div>`;
if(S.tab==='h')b=`<div class="sc"><table><tr><th>Data/hora</th><th>Evento</th><th>Usuário</th><th>Detalhes</th></tr>${c.hist.map(h=>`<tr><td>${h.dt}</td><td>${h.ev}</td><td>${esc(h.user)}</td><td>${esc(h.det)}</td></tr>`).join('')}</table></div>`;
return `<h1>Comunicação</h1><div class="mut">Comunicado ${c.num} · ${esc(c.ass)}</div>${ban}<div class="box"><div class="tb">${tabs}</div>${b}</div><div style="display:flex;gap:10px;margin-top:14px"><button class="bs" onclick="S.view='list';R()">&lt; Voltar</button><button class="bs" onclick="S.view='rep';R()">Relatório / Imprimir</button>${c.sit==='Em elaboração'?`<button class="bp" onclick="act('edit',${c.id})">Editar rascunho</button>`:''}</div>`}
function vForm(){const m=me(),o=m.lado==='org',c=S.ed?D.find(q=>q.id===S.ed):null,x=c&&c.dx;
return `<h1>${c?'Editar rascunho':'Adicionar registro'}</h1><div class="box"><div class="lbl">Instrumento de referência</div>Contrato 00001/2026 · Vigência 01/01/2026 a 31/12/2026<div class="lbl">Categoria</div>Comunicado (as demais categorias estão fora do escopo deste protótipo)
<div class="lbl">Tipo</div><select id="ft">${['Aviso','Nota Técnica','Ofício','Outro'].map(y=>`<option${c&&c.tipo===y?' selected':''}>${y}</option>`).join('')}</select><div class="lbl">Assunto *</div><input type="text" id="fa" value="${c?esc(c.ass):''}"><div class="lbl">Descrição da comunicação *</div><textarea id="fx" rows="4" maxlength="2000">${c?esc(c.desc):''}</textarea>
<div class="hl" style="border:2px solid var(--pri)"><b>Resposta da outra parte</b><div class="lbl">Este comunicado exige resposta ${o?'do fornecedor':'da fiscalização'}? *</div><label><input type="radio" name="fe" value="s"${x?' checked':''} onchange="document.getElementById('fp').style.display='block'"> Sim</label> &nbsp; <label><input type="radio" name="fe" value="n"${x?'':' checked'} onchange="document.getElementById('fp').style.display='none'"> Não, é apenas informativo</label><div id="fp" style="display:${x?'block':'none'};max-width:220px"><div class="lbl">Prazo para resposta *</div><input type="date" id="fz" value="${c&&c.dz||'2026-10-15'}" min="${TODAY}"></div></div>
${o?`<div class="hl"><b>Atribuição (opcional)</b><div class="lbl">Atribuir a</div><select id="fr"><option value="">Não atribuir agora</option>${RESP.map(r=>`<option value="${r[0]}"${c&&c.rs===r[0]?' selected':''}>${r[0]} · ${r[1]}</option>`).join('')}</select><div class="lbl">Orientação ao responsável</div><textarea id="fo" rows="2" maxlength="500"></textarea><label style="display:block;margin-top:8px"><input type="checkbox" id="fn"> Enviar notificação ao responsável (e-mail e sino do sistema)</label><div class="mut" style="font-size:12px;margin-top:4px">Se não atribuir agora, o botão Atribuir ficará disponível na lista.</div></div>`:''}</div>
<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px"><button class="bs" onclick="S.view='list';S.ed=null;R()">&lt; Voltar</button><button class="bs" onclick="act('save',1)">Salvar rascunho</button><button class="bp" onclick="act('save',0)">Enviar</button></div>`}
function vRep(){const c=cur(),o=me().lado==='org';return `<div class="np" style="display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap"><h1>Relatório do comunicado ${c.num}</h1><span><button class="bs" onclick="S.view='det';R()">&lt; Voltar</button> <button class="bs" onclick="window.print()">Imprimir</button> <button class="bp" onclick="window.print()">Baixar PDF</button></span></div><div class="np mut">Em "Imprimir", escolha "Salvar como PDF" no destino.</div>
<div class="paper"><div style="display:flex;justify-content:space-between;border-bottom:3px solid #0c326f;padding-bottom:8px"><b style="font-size:22px;color:#0c326f">Contratos.gov.br</b><span style="text-align:right;font-size:11px"><b style="font-size:14px">Relatório de Comunicação</b><br>Gerado em ${now().replace(' ',' às ')}<br>por ${me().nome} (${me().papel})</span></div>
<div class="hh">1. Dados da comunicação</div><table style="font-size:12px"><tr><td>Instrumento</td><td>Contrato 00001/2026</td></tr><tr><td>Categoria / Tipo</td><td>Comunicado · ${c.tipo}</td></tr><tr><td>Número / Data</td><td>${c.num} · ${fd(c.data)}</td></tr><tr><td>Assunto</td><td>${esc(c.ass)}</td></tr><tr><td>Remetente</td><td>${L[c.lado]} – ${au(c.lado)}</td></tr><tr><td>Situação</td><td>${c.sit}</td></tr><tr><td>Pendência</td><td>${pend(c).replace(/<[^>]+>/g,'')}</td></tr>${o?`<tr><td>Atribuído a</td><td>${c.rs||'não atribuído'}</td></tr>`:''}<tr><td>Descrição</td><td>${esc(c.desc)}</td></tr></table>
<div class="hh">2. Mensagens (${c.msgs.length})</div>${c.msgs.map(x=>`<p style="font-size:12px;border-left:4px solid #888;padding-left:8px"><b>${L[x.lado]} – ${esc(x.autor)}</b> · ${x.dt}${x.ex?' · Exige resposta até '+fs(x.ex):''}<br>${esc(x.txt)}</p>`).join('')||'<p style="font-size:12px">Sem mensagens.</p>'}
<div class="hh">3. Histórico</div><table style="font-size:12px"><tr><th>Data/hora</th><th>Evento</th><th>Usuário</th><th>Detalhes</th></tr>${c.hist.map(h=>`<tr><td>${h.dt}</td><td>${h.ev}</td><td>${esc(h.user)}</td><td>${esc(h.det)}</td></tr>`).join('')}</table></div>`}
function vMod(){const c=cur(),t=S.m;let h='',ok='Confirmar';
const res=`<div class="hl" style="font-size:13px"><b>Comunicado ${c.num}</b> · ${esc(c.ass)}<br>${L[c.lado]} · ${fd(c.data)}${c.pend?' · Aguardando '+L[c.pend.de]+' até '+fd(c.pend.prazo):''}</div>`;
if(t==='atr'){ok=c.rs?'Reatribuir':'Atribuir';h=`<h2 style="margin:0 0 8px">${ok} comunicado</h2>${res}${c.rs?`<p>Responsável atual: <b>${c.rs}</b></p>`:''}<div class="lbl">${c.rs?'Novo responsável':'Responsável'} *</div><select id="mr"><option value="">Selecione um responsável do contrato...</option>${RESP.map(r=>`<option value="${r[0]}">${r[0]} · ${r[1]}</option>`).join('')}</select><div class="mut" style="font-size:12px">Somente responsáveis cadastrados no contrato pelo Setor Contratos.</div>${c.rs?'<div class="lbl">Justificativa da reatribuição *</div><input type="text" id="mj">':''}<div class="lbl">Orientação ao responsável</div><textarea id="mo" rows="3" maxlength="500"></textarea><label style="display:block;margin-top:8px"><input type="checkbox" id="mn" checked> Notificar por e-mail e no sino do sistema</label>`}
if(t==='enc'){h=`<h2 style="margin:0 0 8px">Encerrar comunicado?</h2>${res}<p>O comunicado não aceitará novas mensagens, mas poderá ser reaberto com justificativa. Não há encerramento automático.</p><div class="lbl">Motivo (opcional)</div><input type="text" id="mj">`}
if(t==='reab'){h=`<h2 style="margin:0 0 8px">Reabrir comunicado?</h2>${res}<p>O comunicado volta a aceitar mensagens e a situação passa para Visualizado.</p><div class="lbl">Justificativa da reabertura *</div><input type="text" id="mj">`}
return `<div class="ov" role="dialog" aria-modal="true"><div class="md">${h}<div style="display:flex;justify-content:flex-end;gap:10px;margin-top:16px"><button class="bs" onclick="S.m=null;R()">Cancelar</button><button class="bp" onclick="act('ok')">${ok}</button></div></div></div>`}
const v=id=>(document.getElementById(id)||{}).value||'';
function act(a,x,y){const m=me();let c=D.find(k=>k.id===(x&&typeof x==='number'?x:S.id));
if(a==='open'){S.id=x;S.tab=y;S.view='det';c=cur();if(c.lado!==m.lado&&c.sit==='Enviado'){c.sit='Visualizado';add(c,'Visualizado')}c.un[m.lado]=false}
if(a==='atr'||a==='enc'||a==='reab'){S.id=x||S.id;S.m=a}
if(a==='edit'){S.ed=x;S.view='form'}
if(a==='del'){D=D.filter(k=>k.id!==x);toast('Rascunho excluído')}
if(a==='send'){const t=v('tx').trim(),ex=document.getElementById('ex').checked;if(!t)return toast('Escreva a mensagem antes de enviar.');if(ex&&!v('pz'))return toast('Informe o prazo para resposta.');
c.msgs.push({lado:m.lado,autor:au(m.lado),dt:now(),txt:t,ex:ex?v('pz'):null});c.un[oth(m.lado)]=true;let det='';
if(c.pend&&c.pend.de===m.lado){c.ok={por:m.lado,em:fs(TODAY)};c.pend=null;det='Respondeu à pendência. '}
if(ex){c.pend={de:oth(m.lado),prazo:v('pz')};det+='Exige resposta até '+fd(v('pz'))}c.hist.push(H(now(),'Mensagem enviada',m.nome+' ('+m.papel+')',det));toast('Mensagem enviada')}
if(a==='save'){if(!v('fa').trim()||!v('fx').trim())return toast('Preencha assunto e descrição.');const ex=document.querySelector('input[name=fe]:checked').value==='s';if(ex&&!x&&!v('fz'))return toast('Informe o prazo para resposta.');
const fr=v('fr'),nf=!!(document.getElementById('fn')&&document.getElementById('fn').checked),us=m.nome+' ('+m.papel+')';let k=S.ed?D.find(q=>q.id===S.ed):null;
if(!k){const n=D.length+1;k=mk(n+10,'0000'+n+'/2026','','',m.lado,TODAY,'','Em elaboração',null,null,null,[],{org:false,forn:false});k.hist[0].ev=x?'Rascunho criado':'Enviado';D.push(k)}else k.hist.push(H(now(),x?'Rascunho editado':'Enviado',us,''));
k.tipo=v('ft');k.ass=v('fa').trim();k.desc=v('fx').trim();k.dx=ex;k.dz=v('fz');const h=k.hist[k.hist.length-1];
if(!x){k.sit='Enviado';k.data=TODAY;k.pend=ex?{de:oth(m.lado),prazo:v('fz')}:null;k.un[oth(m.lado)]=true;h.ev='Enviado';h.det=ex?'Exige resposta até '+fd(v('fz')):''}
if(fr&&fr!==k.rs){k.rs=fr;k.hist.push(H(now(),'Atribuído',us,'Para '+fr+(v('fo')?'. Orientação: '+v('fo'):'')))}
if(!x&&k.rs&&nf)k.hist.push(H(now(),'Responsável notificado',us,k.rs+' (e-mail e sino do sistema)'));
S.view='list';S.ed=null;toast(x?'Rascunho salvo':'Comunicado enviado'+(k.rs&&nf?' e '+k.rs+' notificado(a)':''))}
if(a==='ok'){const t=S.m;
if(t==='atr'){const r=v('mr');if(!r)return toast('Selecione o responsável.');if(c.rs&&!v('mj').trim())return toast('Informe a justificativa.');add(c,c.rs?'Reatribuído':'Atribuído',(c.rs?'De '+c.rs+' para ':'Para ')+r+(v('mo')?'. Orientação: '+v('mo'):'')+(c.rs&&v('mj')?'. Justificativa: '+v('mj'):''));c.rs=r;if(document.getElementById('mn')&&document.getElementById('mn').checked)add(c,'Responsável notificado',r);toast('Atribuído a: '+r)}
if(t==='enc'){c.sit='Encerrado';add(c,'Encerrado','Encerrado manualmente.'+(v('mj')?' Motivo: '+v('mj'):''));toast('Comunicado encerrado')}
if(t==='reab'){if(!v('mj').trim())return toast('Informe a justificativa.');c.sit='Visualizado';add(c,'Reaberto','Justificativa: '+v('mj'));toast('Comunicado reaberto')}S.m=null}
R()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.m){S.m=null;R()}});
R();
</script></body></html>
